<script>

// Paste the exact link from AppGallery Connect / the live AppGallery page (don't guess the format).
var STORE_URL = "";
// While STORE_URL is empty, the QR code (which only points at THIS page)
// shows "coming soon" instead of a broken store link. Once you fill it in,
// every QR already printed or shipped starts redirecting. No new QR needed.
(function () {
  var title = document.getElementById("status-title");
  var body = document.getElementById("status-body");
  var go = document.getElementById("go");
  var lane = document.getElementById("lane");
  if (STORE_URL) {
    title.textContent = "Opening Huawei AppGallery";
    body.textContent = "One moment. If nothing happens, use the button.";
    go.textContent = "Open Huawei AppGallery";
    go.href = STORE_URL;
    lane.classList.remove("hidden");
    location.replace(STORE_URL);
  } else {
    title.textContent = "Coming soon to Huawei AppGallery";
    body.textContent = "The app is not published yet. Please check back shortly.";
    go.textContent = "Back to CarDodger";
  }
})();
</script>
